<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="600" fill="#141414"/>
  <text x="40" y="38" fill="#eeeeee" font-size="18" font-weight="700">Side view: what goes where</text>

  <!-- outside: night sky + ground -->
  <rect x="0" y="60" width="470" height="460" fill="#10182a"/>
  <rect x="0" y="520" width="1000" height="80" fill="#1f1f1f"/>
  <text x="40" y="580" fill="#8a8a8a" font-size="14">Street / sidewalk</text>

  <!-- house wall with window opening -->
  <rect x="470" y="60" width="26" height="460" fill="#5a4a3c"/>
  <rect x="470" y="170" width="26" height="190" fill="#141414"/>
  <!-- glass -->
  <line x1="483" y1="170" x2="483" y2="360" stroke="#9ec9e6" stroke-width="3" opacity="0.8"/>
  <!-- sill -->
  <rect x="462" y="360" width="44" height="10" fill="#7a6a5a"/>

  <!-- room interior (dark) -->
  <rect x="496" y="60" width="504" height="390" fill="#0b0b0b"/>
  <!-- 2nd floor -->
  <rect x="496" y="450" width="504" height="14" fill="#3b3b3b"/>
  <text x="900" y="485" fill="#8a8a8a" font-size="13" text-anchor="end">Floor of the room</text>
  <!-- sill height bracket -->
  <line x1="790" y1="370" x2="790" y2="450" stroke="#777" stroke-width="1.5"/>
  <line x1="782" y1="370" x2="798" y2="370" stroke="#777" stroke-width="1.5"/>
  <line x1="782" y1="450" x2="798" y2="450" stroke="#777" stroke-width="1.5"/>
  <line x1="496" y1="370" x2="790" y2="370" stroke="#555" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="806" y="405" fill="#cccccc" font-size="13">Sill sits above</text>
  <text x="806" y="422" fill="#cccccc" font-size="13">the floor, so the</text>
  <text x="806" y="439" fill="#cccccc" font-size="13">figure is lowered 20%</text>

  <!-- sheer curtain (wavy) -->
  <path d="M507 160 q6 12 0 24 q-6 12 0 24 q6 12 0 24 q-6 12 0 24 q6 12 0 24 q-6 12 0 24 q6 12 0 24 q-6 12 0 24 q6 12 0 24" fill="none" stroke="#d8d8d8" stroke-width="2.5" opacity="0.75"/>

  <!-- TV, portrait, side view, screen faces the window -->
  <rect x="522" y="175" width="18" height="190" rx="2" fill="#2c2c2c" stroke="#666" stroke-width="1.5"/>
  <rect x="522" y="175" width="4" height="190" fill="#e6e6e6" opacity="0.55"/>
  <!-- TV stand / table -->
  <rect x="514" y="365" width="34" height="6" fill="#555"/>
  <rect x="528" y="371" width="6" height="79" fill="#555"/>

  <!-- Mac -->
  <rect x="640" y="418" width="70" height="32" rx="5" fill="#bdbdbd"/>
  <text x="675" y="439" fill="#222" font-size="12" text-anchor="middle" font-weight="700">Mac</text>
  <!-- HDMI cable -->
  <path d="M640 434 C 590 434, 560 420, 540 360" fill="none" stroke="#e0a030" stroke-width="2.5"/>

  <!-- viewer -->
  <circle cx="150" cy="448" r="13" fill="#9a9a9a"/>
  <rect x="140" y="462" width="20" height="40" rx="6" fill="#9a9a9a"/>
  <rect x="142" y="500" width="7" height="20" fill="#9a9a9a"/>
  <rect x="151" y="500" width="7" height="20" fill="#9a9a9a"/>
  <!-- sight line -->
  <line x1="162" y1="444" x2="520" y2="250" stroke="#d4a72c" stroke-width="1.8" stroke-dasharray="7 6"/>
  <text x="40" y="392" fill="#cccccc" font-size="14">Trick-or-treaters look up</text>

  <!-- callouts -->
  <g font-size="14" fill="#eeeeee">
    <line x1="510" y1="140" x2="560" y2="105" stroke="#888" stroke-width="1"/>
    <text x="566" y="96">Sheer curtain between glass and TV</text>
    <text x="566" y="113" fill="#9a9a9a" font-size="12.5">hides the screen's edges and blurs her into a shape</text>

    <line x1="541" y1="200" x2="600" y2="190" stroke="#888" stroke-width="1"/>
    <text x="606" y="186">Portrait TV (1080 × 1920), screen facing out</text>
    <text x="606" y="203" fill="#9a9a9a" font-size="12.5">brightness turned down; auto power-off disabled</text>

    <line x1="676" y1="418" x2="700" y2="300" stroke="#888" stroke-width="1"/>
    <text x="706" y="282">Mac runs the scheduler</text>
    <text x="706" y="299" fill="#9a9a9a" font-size="12.5">display rotated to portrait, auto-login on</text>

    <text x="560" y="250" fill="#9a9a9a" font-size="13">Room lights off</text>
  </g>
</svg>
